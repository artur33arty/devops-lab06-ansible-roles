---
# 1. Установка Nginx 
- name: Install nginx
  ansible.builtin.apt:
    update_cache: true
    name: nginx
    state: latest

# 2. Создание каталогов для каждого сайта 
- name: Create sites folders
  ansible.builtin.file:
    path: "/var/www/{{ item }}/"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ sites }}"

# 3. Генерация конфигурации Nginx из шаблона с уведомлением хэндлера 
- name: Copy nginx config from template
  ansible.builtin.template:
    src: 'site.conf.j2'
    dest: "/etc/nginx/conf.d/site-{{ item }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
  notify: restart nginx

# 4. Генерация индексной страницы index.html для каждого сайта
- name: Copy index from template
  ansible.builtin.template:
    src: 'index.html.j2'
    dest: "/var/www/{{ item }}/index.html"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
